server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-runner
  datasource:
    url: jdbc:mysql://localhost:3306/campus_runner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.campusrunner.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl 移除：生产环境禁止打印SQL日志
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:campusRunnerSecretKey2025ForGraduationProject}
  # 生产环境请通过 JWT_SECRET 环境变量设置高强度密钥
  expiration: 604800000  # 7天，单位毫秒
  header: Authorization
  token-prefix: Bearer

# 日志配置
logging:
  level:
    com.campusrunner: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
